# Codemagic iOS workflow for the Reactor Run Capacitor app.
# Builds a signed App Store IPA and uploads it to TestFlight.
# Do not set testFlightInternalTestingOnly: that mark blocks external testing and App Store review.
# The App Store Connect key name below matches Team integrations → Developer Portal.
workflows:
  ios-capacitor:
    name: Reactor Run iOS
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: Reactor-Run-Key
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: ro.biotic.reactorrun
      vars:
        XCODE_PROJECT: ios/App/App.xcodeproj
        XCODE_SCHEME: App
      node: 22
      xcode: latest
    scripts:
      - name: Install npm dependencies
        script: npm ci
      - name: Build the web game and sync it into the iOS project
        script: |
          npm run build
          npx cap sync ios
      - name: Set the iOS build number
        script: |
          cd "$CM_BUILD_DIR/ios/App"
          # Builds 1–13 are already on App Store Connect. Never reuse them.
          if [ "$BUILD_NUMBER" -lt 14 ]; then
            agvtool new-version -all 14
          else
            agvtool new-version -all "$BUILD_NUMBER"
          fi
      - name: Apply the iOS signing profile
        script: |
          xcode-project use-profiles \
            --project "$CM_BUILD_DIR/$XCODE_PROJECT"
      - name: Build the IPA
        script: |
          xcode-project build-ipa \
            --project "$CM_BUILD_DIR/$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        beta_groups:
          - OldFarticious
